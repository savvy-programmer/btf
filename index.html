<!DOCTYPE html>
<html>
	<head>
		<title>BTF</title>
		<link type="text/css" rel="stylesheet" href="style.css">
		<link type="image/x-icon" rel="icon" href="files/icons/pot_of_greed.ico">
	</head>
	<body>
		<div id="root">
			<div id="p1">
				<div id="p1t1">Balanced Tier Format</div>
			</div>
			<div id="p2">
				<div id="p2t1">Deck: 0 (0/0/0)</div>
				<div id="p2t2">Tier: 0</div>
				<div id="p2p1"></div>
			</div>
			<div id="p3">
				<div id="p3t1">Pool: 0 (0/0/0)</div>
				<div id="p3p1">
					<div id="p3p1p1"></div>
				</div>
			</div>
			<div id="p4">
				<div id="p4t1">Filter</div>
				<div id="p4p1">
					<div id="p4p1p1">
						<span id="p4p1p1t1">Name:</span>
						<input id="p4p1p1tf1" type="text">
					</div>
					<div id="p4p1p2">
						<span id="p4p1p2t1">Desc:</span>
						<input id="p4p1p2tf1" type="text">
					</div>
					<div id="p4p1p3">
						<span id="p4p1p3t1">Type:</span>
						<select id="p4p1p3s1"></select>
					</div>
					<div id="p4p1p4">
						<span id="p4p1p4t1">Subtype:</span>
						<select id="p4p1p4s1"></select>
					</div>
					<div id="p4p1p5">
						<span id="p4p1p5t1">Race:</span>
						<select id="p4p1p5s1"></select>
					</div>
					<div id="p4p1p6">
						<span id="p4p1p6t1">Attrib:</span>
						<select id="p4p1p6s1"></select>
					</div>
					<div id="p4p1p7">
						<input id="p4p1p7tf1" type="text">
						<span id="p4p1p7t1"><=Lv<=</span>
						<input id="p4p1p7tf2" type="text">
					</div>
					<div id="p4p1p8">
						<input id="p4p1p8tf1" type="text">
						<span id="p4p1p8t1"><=Atk<=</span>
						<input id="p4p1p8tf2" type="text">
					</div>
					<div id="p4p1p9">
						<input id="p4p1p9tf1" type="text">
						<span id="p4p1p9t1"><=Def<=</span>
						<input id="p4p1p9tf2" type="text">
					</div>
					<div id="p4p1p10">
						<input id="p4p1p10tf1" type="text">
						<span id="p4p1p10t1"><=Tier<=</span>
						<input id="p4p1p10tf2" type="text">
					</div>
					<div id="p4p1p11">
						<img id="p4p1p11im1" src="files/icons/sort.png">
						<img id="p4p1p11im2" src="files/icons/clear.png">
					</div>
				</div>
			</div>
			<div id="p5">
				<input id="p5bt1" type="button" value="Sort">
				<input id="p5bt2" type="button" value="Shuffle">
				<input id="p5bt3" type="button" value="Clear">
				<input id="p5bt4" type="button" value="Download">
				<input id="p5bt5" type="button" value="Upload">
				<input id="fc" type="file" accept=".ydk">
				<span id="p5t1">Developed by programmer</span>
			</div>

			<img id="imdd" hidden> <!-- image drag and drop -->
			
			<div id="cd" hidden> <!-- card display -->
				<img id="cdim1">
				<textarea id="cdta1"></textarea>
				<input id="cdbt1" type="button" value="Close">
			</div>
		</div>
		
		<script type="module" src="index.js"></script>
	</body>
</html>
